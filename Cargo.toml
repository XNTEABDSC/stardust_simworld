[package]
name = "stardust_simworld"
version = "0.1.0"
edition = "2024"

[dependencies]

bevy = {workspace=true}

frunk = {workspace=true}
frunk_core = {workspace=true}

rand = {workspace=true}
derive_more = { workspace=true,features = ["add","add_assign","not","deref","deref_mut"]}
log = { workspace=true, features = ["max_level_debug", "release_max_level_warn"] }
dashmap = {workspace=true}
bimap = {workspace=true}

wacky_bag = {workspace=true}
wacky_bag_hlist = {workspace=true}
statistic_physics = {workspace=true}
physics_basic = {workspace=true}

wacky_bag_bevy = {path="../wacky_bag_bevy"}

simba = {workspace=true}
num-traits = {workspace=true}
nalgebra = {workspace=true}

# tracing = "0.1.44"

# Enable a small amount of optimization in the dev profile.
# [profile.dev]
# opt-level = 1

# [profile.dev.package.wacky_bag_bevy]
# opt-level = 1

# # Enable a large amount of optimization in the dev profile for dependencies.
# [profile.dev.package."*"]
# opt-level = 3